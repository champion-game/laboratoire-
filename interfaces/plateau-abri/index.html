<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plateau abri</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Filtres SVG (grain, bords usés) utilisés par le rendu de secours -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="rough"><feTurbulence type="fractalNoise" baseFrequency=".05" numOctaves="2" seed="3"/><feDisplacementMap in="SourceGraphic" scale="2.2"/></filter>
  <filter id="splat"><feTurbulence type="fractalNoise" baseFrequency=".08" numOctaves="3" seed="8"/><feDisplacementMap in="SourceGraphic" scale="7"/></filter>
</svg>

<div class="viewport" id="viewport">
<main class="stage" id="stage" data-phase="jour" aria-label="Plateau de défense de l'abri">

  <!-- Décor de fond (ciel, paysage, tour de guet, ville) -->
  <div class="decor" data-asset-base="decor" aria-hidden="true">
    <div class="fx sky"></div>
    <svg class="fx scene" viewBox="0 0 1536 1024" preserveAspectRatio="none">
      <g class="city"><path d="M1290 620V560h14v-40h10v40h12v-70h16v70h10v-30h18v30h14v-110l8-40 8 40v110h14v-50h16v50h20v-30h14v30h30v80Z"/></g>
      <path class="hills" d="M1210 640l60-60 50 30 70-70 60 50 50-40 36 30v100H1210Z"/>
      <path class="ground" d="M1210 640q120-30 326-10v394H1210Z"/>
      <g class="tower">
        <path d="M1250 640l20-170h40l20 170h-8l-18-150h-28l-18 150Z"/>
        <path d="M1258 470h64v-14h-64Z"/><path d="M1252 456l38-30 38 30Z"/>
        <path d="M1262 560h56v5h-56ZM1258 600h64v5h-64Z"/>
        <rect class="tower-light" x="1282" y="460" width="16" height="10"/>
      </g>
      <g class="palisade"><path d="M1210 700l326-80v404H1210Z"/></g>
      <path class="pole" d="M1225 760V580h4v180Z M1200 600h50v3h-50Z"/>
      <circle class="sun" cx="1430" cy="390" r="0"/>
    </svg>
  </div>

  <!-- ============ COLONNE GAUCHE ============ -->
  <section class="panel paper p-jour" data-asset-base="bandeau" aria-label="Jour en cours">
    <div class="jour-text"><span id="phase-label">JOUR</span><b id="jour-num">9</b></div>
    <div class="jour-art fx" aria-hidden="true">
      <svg class="fx" viewBox="0 0 190 120">
        <g class="astre"><circle cx="128" cy="40" r="20"/><g class="rays"><path d="M128 6v10M128 64v10M94 40h10M152 40h10M104 16l7 7M145 57l7 7M104 64l7-7M145 23l7-7"/></g></g>
        <path class="sil" d="M0 120V96l10-6 6 8 8-10 6 10 10-4v-8h4v8l14 2 4-6 4 6h20l6-4 6 4V88h4v12l10-2 8 6 10-8 6 6 8-4 8 6 10-10 6 8 8-2 10 6v14Z"/>
        <path class="sil" d="M50 100l6-50h18l6 50h-4l-5-40h-12l-5 40Z M48 50h34v-6H48Z M50 44l15-12 15 12Z M54 72h22v3H54Z"/>
      </svg>
    </div>
    <div class="losanges" id="losanges" role="img"></div>
  </section>

  <section class="panel dark p-deck" data-asset="panneau-sombre">
    <button class="dos-carte" id="btn-deck" data-asset="dos-carte" aria-label="Deck">
      <svg class="fx" viewBox="0 0 100 100"><defs><mask id="bio-m"><rect width="100" height="100" fill="#fff"/><circle cx="50" cy="50" r="6"/><circle cx="50" cy="27" r="11" transform="rotate(0 50 50)"/><circle cx="50" cy="27" r="11" transform="rotate(120 50 50)"/><circle cx="50" cy="27" r="11" transform="rotate(240 50 50)"/><circle cx="50" cy="50" r="23" fill="none" stroke="#000" stroke-width="2"/></mask></defs><g class="bio" mask="url(#bio-m)"><circle cx="50" cy="33" r="17" transform="rotate(0 50 50)"/><circle cx="50" cy="33" r="17" transform="rotate(120 50 50)"/><circle cx="50" cy="33" r="17" transform="rotate(240 50 50)"/><circle cx="50" cy="50" r="20" fill="none" stroke-width="5"/></g></svg>
    </button>
    <div class="deck-text"><span>DECK</span><b id="deck-num">15</b><small>cartes<br>restantes</small></div>
  </section>

  <button class="panel dark p-pile p-reserve" id="btn-reserve" data-asset="panneau-sombre">
    <i class="ico" data-icon="reserve" data-asset="icone-reserve"></i><span>RÉSERVE</span><b id="reserve-num">2</b>
  </button>
  <button class="panel dark p-pile p-defausse" id="btn-defausse" data-asset="panneau-sombre">
    <i class="ico" data-icon="defausse" data-asset="icone-defausse"></i><span>DÉFAUSSE</span><b id="defausse-num">2</b>
  </button>

  <section class="panel dark p-liste" data-asset="panneau-sombre" aria-labelledby="liste-titre">
    <h2 id="liste-titre">CARTES DISPONIBLES</h2>
    <ul id="liste" role="listbox" aria-label="Cartes disponibles"></ul>
  </section>

  <nav class="menu-bas" aria-label="Menu">
    <button class="panel dark btn-menu" data-action="options" data-asset="panneau-sombre"><i class="ico" data-icon="options" data-asset="icone-options"></i>OPTIONS</button>
    <button class="panel dark btn-menu" data-action="regles" data-asset="panneau-sombre"><i class="ico" data-icon="regles" data-asset="icone-regles"></i>RÈGLES</button>
    <button class="panel dark btn-menu" data-action="recount" data-asset="panneau-sombre"><i class="ico" data-icon="stats" data-asset="icone-stats"></i>RECOUNT</button>
  </nav>

  <!-- ============ PLATEAU ============ -->
  <section class="plateau" id="plateau" data-asset-base="plateau" aria-label="Cour de l'abri">
    <div class="fx enclos" aria-hidden="true"><div class="palissade haut"></div><div class="palissade gauche"></div><div class="palissade droite"></div><div class="portail"></div></div>
    <div class="sol" id="sol">
      <div class="fx dalles"></div>
      <div class="fx ombres"></div>
      <div class="decals" id="decals" aria-hidden="true"></div>
      <div class="lampes fx" id="lampes" aria-hidden="true"></div>
      <div class="pieces" id="pieces"></div>
      <div class="cases" id="cases" role="grid" aria-label="Cases du plateau"></div>
      <div class="nuit-voile" aria-hidden="true"></div>
    </div>
  </section>

  <!-- ============ MAIN ============ -->
  <section class="bac" data-asset="bac-main" aria-label="Main">
    <div class="main" id="main"></div>
  </section>

  <!-- ============ COLONNE DROITE ============ -->
  <nav class="icones-haut" aria-label="Réglages rapides">
    <button class="btn-carre" data-action="son" aria-pressed="true" aria-label="Son" data-asset="bouton-carre"><i class="ico" data-icon="son" data-asset="icone-son"></i></button>
    <button class="btn-carre" data-action="musique" aria-pressed="true" aria-label="Musique" data-asset="bouton-carre"><i class="ico" data-icon="musique" data-asset="icone-musique"></i></button>
    <button class="btn-carre" data-action="plein-ecran" aria-label="Plein écran" data-asset="bouton-carre"><i class="ico" data-icon="plein-ecran" data-asset="icone-plein-ecran"></i></button>
    <button class="btn-carre" data-action="stats" aria-label="Statistiques" data-asset="bouton-carre"><i class="ico" data-icon="stats" data-asset="icone-stats"></i></button>
  </nav>

  <section class="panel paper p-abri" data-asset="panneau-papier" aria-label="Abri">
    <div class="abri-text"><span>SHELTER</span><b id="abri-pv">190 / 200</b></div>
    <div class="abri-art" data-asset="illus-abri" aria-hidden="true">
      <svg class="fx" viewBox="0 0 170 70"><path class="sil" d="M0 70V58h10V40h8v-6h6v6h10V28h-4l14-14 14 14h-4v12h14V30l6-8 6 8v10h20V24h6v-8h4v8h6v24h12V36l10-6 10 6v22h14V70Z M60 50h6v8h-6Z M90 46h6v8h-6Z"/><path class="sil" d="M0 68h170v2H0Z"/></svg>
    </div>
    <div class="jauge" data-asset="jauge-vie"><i id="abri-barre"></i></div>
  </section>

  <section class="panel dark p-horde" data-asset="panneau-sombre" aria-label="Zombies">
    <div class="horde-art" data-asset="illus-horde" aria-hidden="true">
      <svg class="fx" viewBox="0 0 120 90"><g class="zsil">
        <path d="M30 20a9 9 0 1 1 0 .1Z M22 32h18l6 22-6 2-3-12v42h-6l-2-24-2 24h-6V44l-3 12-6-2Z"/>
        <path d="M62 10a11 11 0 1 1 0 .1Z M52 25h22l8 26-7 3-4-14v48h-8l-2-28-3 28h-7V40l-4 14-7-3Z"/>
        <path d="M94 22a9 9 0 1 1 0 .1Z M86 34h17l6 20-6 2-3-11v40h-6l-2-22-2 22h-6V45l-3 11-6-2Z"/></g></svg>
    </div>
    <div class="horde-text"><b><span id="zombies-num">7</span> ZOMBIES</b><small>encore dehors.</small><div class="vagues" id="vagues"></div></div>
  </section>

  <button class="btn-affronter" id="btn-affronter" data-asset="bouton-affronter">
    <svg class="fx" viewBox="0 0 90 100" aria-hidden="true"><g class="zsil"><path d="M30 18a9 9 0 1 1 0 .1Z M22 30h18l6 22-6 2-3-12v46h-6l-2-26-2 26h-6V42l-3 12-6-2Z"/><path d="M64 30a8 8 0 1 1 0 .1Z M57 41h15l5 18-5 2-3-10v37h-5l-2-21-2 21h-5V51l-2 10-5-2Z"/></g></svg>
    <span id="affronter-label">AFFRONTER<br>LA NUIT</span>
  </button>

  <div class="panel dark vitesses" role="radiogroup" aria-label="Vitesse" data-asset="panneau-sombre">
    <button role="radio" data-speed="1" data-asset="bouton-vitesse"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 2l14 8-14 8Z"/></svg>x1</button>
    <button role="radio" data-speed="2" data-asset="bouton-vitesse">x2</button>
    <button role="radio" data-speed="4" data-asset="bouton-vitesse">x4</button>
  </div>

  <p class="sr-only" id="annonce" role="status" aria-live="polite"></p>
</main>
</div>

<!-- Barre de test : retour au menu + états à tester. À retirer pour l'intégration au jeu. -->
<div class="ui-dev" id="ui-dev">
  <a class="ui-dev-back" href="../../index.html">← Retour au menu</a>
  <details><summary>Tester</summary><div id="ui-tests"></div></details>
</div>

<script src="script.js"></script>
</body>
</html>
