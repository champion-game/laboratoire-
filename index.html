<title>Laboratoire — Interfaces</title>
<!-- Menu : une simple liste de liens vers interfaces/<nom>/index.html.
     Il ne charge rien des interfaces : si un dossier manque ou est cassé, seul son lien mène à une erreur.
     Ajouter une interface = ajouter un <li> ci-dessous. -->
<style>
:root{--bg:#141210;--panel:#1e1a16;--line:#3a3128;--text:#e6dcc6;--muted:#9a8f7a;--gold:#c99a3b}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:system-ui,sans-serif}
header{padding:16px;border-bottom:1px solid var(--line);background:var(--panel)}
h1{margin:0;font-size:18px;letter-spacing:.04em}
h1 span{color:var(--gold)}
ul{list-style:none;margin:0 auto;padding:16px;max-width:1100px;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
a{display:block;height:100%;text-decoration:none;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;transition:border-color .15s,transform .15s}
a:hover,a:focus-visible{border-color:var(--gold);transform:translateY(-2px);outline:none}
strong{display:block;margin-bottom:6px;font-size:17px}
small{display:block;color:var(--muted);font-size:14px}
code{display:block;margin-top:10px;color:var(--muted);font-size:12px}
</style>
</head>
<body>
<header><h1><span>Laboratoire</span> — Interfaces</h1></header>
<ul>
  <li><a href="interfaces/collection/index.html"><strong>Collection</strong><small>Grille de cartes Barricard avec filtres</small><code>interfaces/collection/</code></a></li>
  <li><a href="interfaces/classeur/index.html"><strong>Classeur</strong><small>Vue classeur avec pages qui se tournent</small><code>interfaces/classeur/</code></a></li>
  <li><a href="interfaces/terres-mortes/index.html"><strong>Terres mortes</strong><small>Collection Terres mortes</small><code>interfaces/terres-mortes/</code></a></li>
</ul>
</body>
</html>
