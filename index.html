<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laboratoire — Menus</title>
<style>
:root{--bg:#141210;--panel:#1e1a16;--line:#3a3128;--text:#e6dcc6;--muted:#9a8f7a;--gold:#c99a3b}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font-family:system-ui,sans-serif}
header{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
header h1{margin:0;font-size:18px;letter-spacing:.04em}
header h1 span{color:var(--gold)}
#back{display:none;border:1px solid var(--line);background:none;color:var(--text);padding:6px 12px;border-radius:6px;font:inherit;cursor:pointer}
#back:hover{border-color:var(--gold)}
body.viewing #back{display:inline-block}
main{padding:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;max-width:1100px;margin:0 auto}
.menu{display:block;text-decoration:none;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;transition:border-color .15s,transform .15s}
.menu:hover,.menu:focus-visible{border-color:var(--gold);transform:translateY(-2px);outline:none}
.menu h2{margin:0 0 6px;font-size:17px}
.menu p{margin:0;color:var(--muted);font-size:14px}
.menu code{display:block;margin-top:10px;color:var(--muted);font-size:12px}
#frame{display:none;position:fixed;left:0;right:0;bottom:0;width:100%;border:0;background:#000}
body.viewing main{display:none}
body.viewing #frame{display:block}
.empty{color:var(--muted);text-align:center}
</style>
</head>
<body>
<header>
  <button id="back" type="button">‹ Menus</button>
  <h1 id="title"><span>Laboratoire</span> — Menus</h1>
</header>
<main><div class="grid" id="grid"></div></main>
<iframe id="frame" title="Menu"></iframe>

<script src="menus/menus.js"></script>
<script>
// Le lanceur ne connaît que menus/menus.js.
// Chaque menu s'ouvre dans une iframe : son CSS et son JS restent isolés.
const menus = window.MENUS || [];
const grid = document.getElementById('grid');
const frame = document.getElementById('frame');
const title = document.getElementById('title');
const header = document.querySelector('header');

if (!menus.length) grid.innerHTML = '<p class="empty">Aucun menu dans menus/menus.js</p>';
for (const m of menus) {
  const a = document.createElement('a');
  a.className = 'menu';
  a.href = '#/' + m.id;
  a.innerHTML = '<h2></h2><p></p><code></code>';
  a.querySelector('h2').textContent = m.titre;
  a.querySelector('p').textContent = m.description || '';
  a.querySelector('code').textContent = 'menus/' + m.id + '/';
  grid.append(a);
}

function route() {
  const id = location.hash.replace(/^#\/?/, '');
  const m = menus.find(x => x.id === id);
  if (m) {
    const src = 'menus/' + m.id + '/index.html';
    if (frame.getAttribute('src') !== src) frame.src = src;
    frame.style.top = header.offsetHeight + 'px';
    frame.style.height = 'calc(100% - ' + header.offsetHeight + 'px)';
    title.innerHTML = '<span></span>';
    title.firstChild.textContent = m.titre;
    document.title = m.titre + ' — Laboratoire';
    document.body.classList.add('viewing');
  } else {
    frame.removeAttribute('src');
    title.innerHTML = '<span>Laboratoire</span> — Menus';
    document.title = 'Laboratoire — Menus';
    document.body.classList.remove('viewing');
  }
}
document.getElementById('back').onclick = () => { location.hash = ''; };
addEventListener('hashchange', route);
route();
</script>
</body>
</html>
